---
argument_specs:
  main:
    short_description: Manage reboots for Windows.
    description:
      - Checks the pending-reboot fact and reboots Windows hosts that need
        it, never, or always, optionally in check mode.
    author:
      - Trond Hindenes
    options:
      winreboot_simulate:
        type: bool
        default: false
        description: Run the reboot in check mode so nothing reboots.
      winreboot_reboot_behavior:
        type: str
        default: if_required
        choices:
          - never
          - if_required
          - always
        description: When to reboot the node.
      winreboot_connect_timeout:
        type: int
        default: 5
        description: >-
          Seconds to wait for a single successful connection to the host
          before trying again.
      winreboot_reboot_timeout:
        type: int
        default: 3600
        description: >-
          Seconds to wait for the host to come back and respond to a test
          command.
