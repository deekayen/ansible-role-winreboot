---
- name: Validate role variables.
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Show pending reboot status from fact gathering.
  ansible.builtin.debug:
    var: ansible_facts.reboot_pending
    verbosity: 1

- name: Show configured reboot behavior.
  ansible.builtin.debug:
    var: winreboot_reboot_behavior
    verbosity: 2

- name: Set reboot flag based on pending reboot and behavior.
  ansible.builtin.set_fact:
    winreboot_do_reboot: >-
      {{ winreboot_reboot_behavior == 'always'
         or (winreboot_reboot_behavior == 'if_required'
             and ansible_facts.reboot_pending | default(false) | bool) }}

- name: Reboot status.
  ansible.builtin.debug:
    var: winreboot_do_reboot
    verbosity: 2

- name: Reboot.
  ansible.windows.win_reboot:
    connect_timeout: "{{ winreboot_connect_timeout | default(omit) }}"
    reboot_timeout: "{{ winreboot_reboot_timeout | default(omit) }}"
  check_mode: "{{ winreboot_simulate | bool }}"
  register: winreboot_result
  when: winreboot_do_reboot | bool

- name: Print reboot information in debug mode.
  ansible.builtin.debug:
    var: winreboot_result
    verbosity: 2
